name: Release

# Releases master: Actions → Release → Run workflow (or `gh workflow run release.yml -f dry_run=false`).
# A dry run (the default) only writes the plan to the job summary: next version, PRs by category, CI status.
# A real run bumps backend/build.gradle.kts, frontend/package.json and cli/build.gradle.kts, pushes that commit and the
# vX.Y.Z tag to master with a short-lived token of the release GitHub App and puts the notes on the draft release of
# the tag. The tag push starts the Docker workflows and cli_native, which attaches the CLI binaries to the same draft.
# Releases are immutable once published, so publishing the draft stays manual and comes after the binaries are
# attached.
#
# One-time setup (repository settings):
# - A GitHub App owned by TorMap, installed only on this repository, without webhook, with the repository permission
#   Contents: read and write (nothing else).
# - Environment `release`: deployment branches "master" only. Variable RELEASE_APP_CLIENT_ID: the app's client ID.
#   Secret RELEASE_APP_PRIVATE_KEY: a private key of the app.
# - Rulesets: the app may bypass the tag ruleset and the master rules (required status checks, pull requests).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. auto picks it from the PR labels (breaking → major, enhancement or deployment → minor, else patch)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Only show the plan, change nothing
        type: boolean
        default: true
      description:
        description: Optional release description for users (Markdown), put above the generated notes
        type: string
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags and history since the last release
          persist-credentials: false

      - name: Plan the release
        id: plan
        run: python3 .github/scripts/release-plan.py
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}

  release:
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Holds the release app's private key and only allows master, so no other branch or workflow can push release tags
    environment: release
    permissions:
      contents: read # everything that writes uses the app token
    steps:
      - name: Create a token of the release app
        # Valid for an hour, limited to this repository and its contents, revoked when the job ends
        id: app_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }} # exactly the commit whose CI passed
          token: ${{ steps.app_token.outputs.token }}

      - name: Bump versions, commit and tag
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          sed -i "s/^version = \".*\"$/version = \"$VERSION\"/" backend/build.gradle.kts cli/build.gradle.kts
          sed -i "0,/\"version\": \"[^\"]*\"/s//\"version\": \"$VERSION\"/" frontend/package.json
          # The default image tag of docker compose follows the major version, so a new major is picked up
          sed -i "s/\${TORMAP_VERSION:-[0-9]*}/\${TORMAP_VERSION:-${VERSION%%.*}}/" backend/docker-compose.yml
          sed -i "s/^TORMAP_VERSION=[0-9]*$/TORMAP_VERSION=${VERSION%%.*}/" backend/.env.example
          .github/scripts/check-release-version.sh "$TAG"
          # Commit as the app's bot user, so the bump shows who made it
          bot_id=$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$bot_id+$APP_SLUG[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "chore(release): bump version to $VERSION"
          fi
          git tag -a "$TAG" -m "TorMap $VERSION"
          # Atomic and without force: if master moved since the plan, nothing is pushed
          git push --atomic origin HEAD:refs/heads/master "refs/tags/$TAG"

      - name: Put the notes on the draft release
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          generated=$(gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" \
            -f previous_tag_name="$PREVIOUS_TAG" --jq .body)
          printf '%s\n\n%s\n' "${DESCRIPTION:-_Add the release description here._}" "$generated" > notes.md
          # cli_native creates the draft too when it attaches the binaries, so whichever comes first creates it
          if gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md; then
            echo "Created the draft release $TAG."
          else
            gh release edit "$TAG" --draft --notes-file notes.md
            echo "Updated the notes of the existing draft release $TAG."
          fi
          {
            echo "## Next steps"
            echo ""
            echo "- Wait for backend_docker, frontend_docker and cli_native on $TAG: https://github.com/$GH_REPO/actions?query=branch%3A$TAG"
            echo "- Check the draft (description, deployment notes, CLI binaries and SHA256SUMS): https://github.com/$GH_REPO/releases"
            echo "- Publish security advisories fixed in this release together with it."
            echo "- Publish the draft. Published releases are immutable, so only after cli_native attached the binaries."
          } >> "$GITHUB_STEP_SUMMARY"

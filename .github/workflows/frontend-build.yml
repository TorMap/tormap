name: Frontend Build (reusable)

on:
  workflow_call:  # makes this callable from other workflows
    inputs:
      run:
        description: Set to false to skip the build, which still reports the job as a passed (skipped) check
        type: boolean
        default: true
    secrets:
      # Reusable workflows only see secrets the caller passes explicitly
      OSM_TOKEN:
        required: false

jobs:
  frontend_build:
    if: inputs.run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2 # base commit is needed to find new or changed dependencies

      # Only looks up packages that are new or changed in yarn.lock, before anything is installed.
      - name: Check dependencies against OpenSourceMalware
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/osm-check.py npm frontend/yarn.lock
        env:
          OSM_TOKEN: ${{ secrets.OSM_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - name: yarn build
        run: |
          cd frontend
          yarn install --immutable
          yarn build
          yarn smoke:load:ci

      - name: yarn test
        run: |
          cd frontend
          yarn playwright install --with-deps chromium
          yarn test:coverage
          yarn smoke:pwa

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 1

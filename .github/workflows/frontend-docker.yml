name: frontend_docker

# - test (pull requests): builds the image for linux/amd64 without any secret, checks that it serves the app with the
#   security headers as non-root, and lists Grype's fixable findings in the job log.
# - frontend_docker (pushes): builds amd64 and arm64 and pushes to Docker Hub (environment docker-hub).
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-docker.yml'
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-docker.yml'

permissions: {}

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --tag tormap/frontend:test frontend

      - name: Check the running image
        run: |
          docker run -d --name frontend -p 8080:8080 tormap/frontend:test
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          curl -sf -D headers.txt -o index.html http://localhost:8080/
          cat headers.txt
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -q 'id="root"' index.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/missing)" = 404
          # The nginx master process must not run as root
          docker top frontend -o user,args
          if docker top frontend -o user,args | grep 'nginx: master' | grep -qw root; then
            echo "::error::nginx runs as root"
            exit 1
          fi

      - name: Container log
        if: failure()
        run: docker logs frontend

      # Same scanner and settings as the weekly image scan
      - name: Scan with Grype
        run: >
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock --volume "$PWD:/work" --workdir /work
          anchore/grype:v0.122.1@sha256:661583704a253c0448ed63998b5ea2cd9d5a76ee71eedc4aed439b8ce3e93a1c
          docker:tormap/frontend:test --config .grype.yaml --only-fixed

  frontend_docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Holds the Docker Hub secrets; its deployment rules allow only master and v* tags
    environment: docker-hub
    permissions:
      contents: read
    steps:
      # Runtime monitoring of this secret-holding job (egress audit, file integrity), see PIPELINE.md
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check that the tag matches the project versions
        # Stop before pushing anything if they differ, so a release tag never overwrites an older image
        if: github.ref_type == 'tag'
        run: .github/scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: DockerHub login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker image name and tags
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: tormap/frontend
          tags: |
            # On v* tag: semver + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            # On master push: edge
            type=edge,branch=master

      - name: Build and push docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          # Build provenance (SLSA) and an SBOM, stored with the image in Docker Hub
          provenance: mode=max
          sbom: true

name: backend_docker

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-docker.yml'

jobs:
  backend_docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check that the tag matches the project versions
        # A v* tag pushes images named after the versions in build.gradle.kts (backend) and the tag (frontend).
        # Stop before pushing anything if they differ, so a release tag never overwrites an older image.
        if: github.ref_type == 'tag'
        run: |
          backend_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/build.gradle.kts)
          frontend_version=$(jq -r .version frontend/package.json)
          for v in "$backend_version" "$frontend_version"; do
            if [[ "v$v" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match backend version $backend_version (backend/build.gradle.kts) and frontend version $frontend_version (frontend/package.json). Bump both versions on master before tagging."
              exit 1
            fi
          done

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build and push docker image
        # On v* tag → semver + :latest. On non-tag push → :edge only.
        run: |
          cd backend
          if [[ "${{ github.ref_type }}" = "tag" ]]; then
            ./gradlew jib # tags come from build.gradle.kts
          elif [[ "${{ github.ref_type }}" = "branch" && "${{ github.ref_name }}" = "master" ]]; then
            ./gradlew jib -Djib.to.image=tormap/backend:edge -Djib.to.tags=edge
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

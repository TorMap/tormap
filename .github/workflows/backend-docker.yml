name: backend_docker

# Builds the backend image (amd64 and arm64) with Jib and publishes it to Docker Hub.
# - build: compiles and builds the image without any secret, into a registry that only lives in this job, and hands
#   the registry storage with the image on as an artifact. Also runs on pull requests, so a broken image build shows
#   up before merge.
# - publish (pushes only, environment docker-hub): serves that storage from a local registry again and copies exactly
#   that image (same digest) to Docker Hub. On v* tags it pushes :<version>, :<major> and :latest and attests the
#   build provenance (`gh attestation verify oci://docker.io/tormap/backend@<digest> --repo TorMap/tormap`); on
#   master it pushes :edge. The build job also lists the image contents in a CycloneDX SBOM (Syft), which the publish
#   job attests on v* tags (`gh attestation verify oci://... --predicate-type https://cyclonedx.org/bom`).
on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-docker.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-docker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Never cancel a publish halfway through
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    services:
      # Jib builds multi-platform images only into a registry, so it gets one inside this job. Its storage is handed on
      # to the publish job, because a Docker manifest list can't be exported to an archive without changing its digest.
      registry:
        image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports:
          - 5000:5000
        volumes:
          # Outside the workspace, which checkout empties
          - /tmp/backend-registry:/var/lib/registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check that the tag matches the project versions
        # Stop before building anything if they differ, so a release tag never overwrites an older image
        if: github.ref_type == 'tag'
        run: .github/scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Published images are built without restored caches
          cache-disabled: true
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the image
        run: |
          cd backend
          ./gradlew jib -Djib.to.image=localhost:5000/tormap/backend:build -Djib.to.tags=build \
            -Djib.allowInsecureRegistries=true

      - name: Export the image
        id: image
        run: |
          digest=$(cat backend/build/jib-image.digest)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected image digest '$digest'"
            exit 1
          fi
          built="sha256:$(skopeo inspect --raw --tls-verify=false docker://localhost:5000/tormap/backend:build \
            | sha256sum | cut -d' ' -f1)"
          if [[ "$built" != "$digest" ]]; then
            echo "::error::The registry has digest $built, Jib reported $digest"
            exit 1
          fi
          sudo tar -C /tmp/backend-registry -cf backend-image-registry.tar .
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image digest: $digest" >> "$GITHUB_STEP_SUMMARY"

      # Syft's own image, pinned by digest (Renovate bumps it), reads the image from the job's registry
      - name: Create the SBOM
        env:
          SYFT_REGISTRY_INSECURE_USE_HTTP: 'true'
        run: >
          docker run --rm --network host --env SYFT_REGISTRY_INSECURE_USE_HTTP
          --volume "$PWD:/work" --workdir /work
          anchore/syft:v1.57.2@sha256:e97e20b6e6d1699c60296b66ab337941724f9bd06ac279d893eda89601fc4b2a
          registry:localhost:5000/tormap/backend:build --platform linux/amd64
          --output cyclonedx-json=backend-sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-image
          path: |
            backend-image-registry.tar
            backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Holds the Docker Hub secrets; its deployment rules allow only master and v* tags
    environment: docker-hub
    permissions:
      contents: read
      # Build provenance and SBOM attestations on release tags
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-image

      - name: Start a registry with the built image
        run: |
          mkdir registry-data
          sudo tar -C registry-data -xf backend-image-registry.tar
          docker run -d --name registry -p 5000:5000 -v "$PWD/registry-data:/var/lib/registry" \
            registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:5000/v2/ && exit 0
            sleep 1
          done
          echo "::error::The registry did not start"
          exit 1

      - name: DockerHub login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        # skopeo reads the credentials of the login above from ~/.docker/config.json
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags=("$version" "${version%%.*}" latest)
          else
            tags=(edge)
          fi
          for tag in "${tags[@]}"; do
            skopeo copy --all --preserve-digests --src-tls-verify=false \
              docker://localhost:5000/tormap/backend:build "docker://docker.io/tormap/backend:$tag"
            pushed="sha256:$(skopeo inspect --raw "docker://docker.io/tormap/backend:$tag" | sha256sum | cut -d' ' -f1)"
            if [[ "$pushed" != "$DIGEST" ]]; then
              echo "::error::tormap/backend:$tag has digest $pushed, expected the built $DIGEST"
              exit 1
            fi
            echo "Pushed tormap/backend:$tag ($DIGEST)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/tormap/backend
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        if: github.ref_type == 'tag'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: index.docker.io/tormap/backend
          subject-digest: ${{ needs.build.outputs.digest }}
          sbom-path: backend-sbom.cdx.json
          push-to-registry: true

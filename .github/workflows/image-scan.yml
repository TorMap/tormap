name: image scan

# Grype scans the published Docker images weekly for known vulnerabilities in OS packages and bundled libraries:
# :latest (the release operators run), so a new advisory for a running image is noticed between releases, and :edge
# (master), which shows whether master already has the fix and only a release is missing. Only findings
# with a fix available are reported. Results go to Code scanning (SARIF, one category per image and tag) and to the job log
# (one line per finding), so agents without Code scanning API access can read them too. Findings don't fail the job.
# A fix ships by updating the dependency or base image and releasing; images are rebuilt only on release.
# https://github.com/anchore/grype Configuration: .grype.yaml

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, new advisories appear without changes here
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/image-scan.yml
      - .grype.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  grype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - backend
          - frontend
          - cli
        tag:
          - latest
          - edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Grype's own image, pinned by digest (Renovate bumps it). It reads the image straight from the registry.
      - name: Scan
        env:
          IMAGE: tormap/${{ matrix.image }}:${{ matrix.tag }}
        run: >
          docker run --rm --volume "$PWD:/work" --workdir /work
          anchore/grype:v0.122.1@sha256:661583704a253c0448ed63998b5ea2cd9d5a76ee71eedc4aed439b8ce3e93a1c
          "registry:$IMAGE" --config .grype.yaml --only-fixed --output sarif --file grype.sarif

      - name: List findings
        env:
          IMAGE: tormap/${{ matrix.image }}:${{ matrix.tag }}
        run: |
          echo "Fixable findings in $IMAGE: $(jq '[.runs[].results[]] | length' grype.sarif)"
          jq -r '.runs[] | (.tool.driver.rules // []) as $rules | .results[] | .ruleId as $id
            | ($rules[] | select(.id == $id) | .properties["security-severity"] // "") as $score
            | "\($score)\t\($id)"' grype.sarif | sort -rn

      # Pull requests from forks get a read-only token, their findings are in the job log
      - name: Upload to Code scanning
        if: >
          !cancelled() && hashFiles('grype.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: grype.sarif
          category: grype-${{ matrix.image }}-${{ matrix.tag }}

name: Frontend Pull Request

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend*'
      - '.github/scripts/osm-check.py'

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend_build:
    uses: ./.github/workflows/frontend-build.yml
    secrets:
      OSM_TOKEN: ${{ secrets.OSM_TOKEN }}

  frontend_build_deploy:
    runs-on: ubuntu-latest
    needs: frontend_build
    permissions:
      contents: read
      deployments: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download frontend build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: frontend/build

      - name: Deploy to preview channel
        if: github.event.pull_request.base.ref == 'master' || github.event.pull_request.base.ref == 'dev'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TORMAP_36F44 }}'
          projectId: tormap-36f44
          entryPoint: ./frontend
          expires: 7d
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels

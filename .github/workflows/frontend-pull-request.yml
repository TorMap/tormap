name: Frontend Pull Request

# Runs on every pull request and skips the build when the frontend is untouched, because a skipped job counts as
# passed for required status checks, while a workflow skipped by `paths:` never reports.
on:
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2 # pull_request checks out a merge commit, its first parent is the base

      - name: Detect changes
        id: filter
        uses: ./.github/actions/changes

  frontend_build:
    needs: changes
    uses: ./.github/workflows/frontend-build.yml
    with:
      # Skipped inside the reusable workflow, so the required check "frontend_build / frontend_build" still reports
      run: ${{ needs.changes.outputs.frontend == 'true' }}
    secrets:
      OSM_TOKEN: ${{ secrets.OSM_TOKEN }}

  frontend_build_deploy:
    runs-on: ubuntu-latest
    needs: [changes, frontend_build]
    if: needs.changes.outputs.frontend == 'true'
    permissions:
      contents: read
      deployments: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download frontend build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: frontend/build

      - name: Deploy to preview channel
        if: github.event.pull_request.base.ref == 'master' || github.event.pull_request.base.ref == 'dev'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TORMAP_36F44 }}'
          projectId: tormap-36f44
          entryPoint: ./frontend
          # Renovate PRs are short-lived and numerous, so their previews expire sooner
          expires: ${{ (github.event.pull_request.user.login == 'renovate[bot]' || startsWith(github.head_ref, 'renovate/')) && '1d' || '3d' }}
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels

name: cli_native

# Native binaries of the CLI (cli/) and the tormap/cli Docker image.
# - Pull requests that change the CLI, the API or the backend: build and smoke-test the binaries, run the Linux binary
#   end to end against a backend with the relays of cli/e2e/fixture.sql, publish nothing.
# - Push to master: also push tormap/cli:edge.
# - v* tag: also attest the build provenance of the binaries, attach them and SHA256SUMS to the draft release of the
#   tag (created if missing) and push tormap/cli:<version>, :<major> and :latest. Releases are immutable once published, so publish the release only
#   after this workflow attached the binaries.
on:
  push:
    tags:
      - 'v*'
    branches:
      - master
    paths:
      - 'cli/**'
      - 'api/**'
      - '.github/workflows/cli-native.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'api/**'
      # The end-to-end test runs the CLI against the backend
      - 'backend/src/main/**'
      - 'backend/build.gradle.kts'
      - '.github/workflows/cli-native.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Never cancel a release run halfway through uploading
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries need glibc from the build machine's version on, so they are built on the oldest
          # supported Ubuntu (glibc 2.35) to run on as many distributions as possible
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: macos-arm64
            runner: macos-15
          - target: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check that the tag matches the project versions
        if: github.ref_type == 'tag'
        shell: bash
        run: bash .github/scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@60e76998d25690099182b796e99b8804da582d90 # v1.6.10
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          check-for-updates: 'false'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Release binaries are built without restored caches
          cache-disabled: true
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the native binary
        shell: bash
        run: cd cli && ./gradlew nativeCompile

      - name: Smoke test
        # The binary starts, parses options and reports an unreachable server as exit code 1
        shell: bash
        run: |
          cd cli/build/native
          ./tormap --version
          ./tormap relays --help > /dev/null
          set +e
          ./tormap --api-url http://127.0.0.1:1 --no-cache days
          status=$?
          set -e
          if [[ $status != 1 ]]; then
            echo "::error::Expected exit code 1 for an unreachable server, got $status"
            exit 1
          fi

      - name: Name the binary after the version and platform
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/build.gradle.kts)
          mkdir dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp cli/build/native/tormap.exe "dist/tormap-$version-${{ matrix.target }}.exe"
          else
            cp cli/build/native/tormap "dist/tormap-$version-${{ matrix.target }}"
          fi
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tormap-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    # The Linux binary against a real backend and database
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Release binaries are built without restored caches
          cache-disabled: true
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tormap-linux-x64
          path: dist

      - name: Start the backend
        # bootRun, because the backend reads the IP lookup databases from its exploded resources. Without the
        # scheduled jobs, it neither processes descriptors nor fills caches before the fixture is in the database.
        env:
          SPRING_DATASOURCE_PASSWORD: postgres
        run: |
          cd backend
          nohup ./gradlew bootRun --args="--tormap.scheduling.enabled=false" > ../backend.log 2>&1 &
          for _ in $(seq 1 120); do
            if curl -sf -o /dev/null http://localhost:8080/; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The backend did not start within 10 minutes"
          tail -100 ../backend.log
          exit 1

      - name: Load the fixture
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < cli/e2e/fixture.sql

      - name: End-to-end test
        run: |
          chmod +x dist/tormap-*-linux-x64
          bash cli/e2e/run.sh "$(ls dist/tormap-*-linux-x64)" http://localhost:8080

      - name: Backend log
        if: failure()
        run: tail -200 backend.log

  release:
    # Attaches the binaries to the draft release of the tag
    needs: [native, e2e]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: signs which workflow run built the binaries (verify with `gh attestation verify`)
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tormap-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum tormap-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # Another workflow may create the release at the same moment, so a failed create is checked again
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG" \
              || gh release view "$TAG" > /dev/null
          fi
          if [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "::error::Release $TAG is already published. Published releases are immutable, so the binaries can not be attached. They are in the artifacts of this run."
            exit 1
          fi
          gh release upload "$TAG" dist/* --clobber

  docker:
    needs: [native, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Holds the Docker Hub secrets; its deployment rules allow only master and v* tags
    environment: docker-hub
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tormap-linux-*
          path: dist
          merge-multiple: true

      - name: Put the binaries where the Dockerfile expects them
        run: |
          mkdir -p cli/build/docker/linux-amd64 cli/build/docker/linux-arm64
          cp dist/tormap-*-linux-x64 cli/build/docker/linux-amd64/tormap
          cp dist/tormap-*-linux-arm64 cli/build/docker/linux-arm64/tormap

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: DockerHub login
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker image name and tags
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: tormap/cli
          tags: |
            # On v* tag: semver + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            # On master push: edge
            type=edge,branch=master

      - name: Build and push docker image
        # No emulation needed: the image only copies the binary of its platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: cli
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

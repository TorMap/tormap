# Configures the notes generated by "Generate release notes" / `gh release create --generate-notes`.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - renovate
    authors:
      - renovate
      - app/renovate
  categories:
    - title: Breaking and deployment changes
      labels:
        - breaking
        - deployment
    - title: Security
      labels:
        - security
    - title: Features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"

app:
    http:
        cache:
            public:
                max-age-seconds: 0
        request:
            # Applies to all request bodies, including JSON (see RequestBodyLimitConfig). 50 000 relay IDs are about 0.5 MiB.
            max-body-bytes: 1048576 # 1 MiB
    security:
        cors:
            allowed-origins: http://localhost:3000
descriptor:
    apiBaseURL: https://collector.torproject.org
    localDownloadDirectory: tormap-data/descriptors
    archiveRelayConsensuses: /archive/relay-descriptors/consensuses/
    archiveRelayServers: /archive/relay-descriptors/server-descriptors/
    recentRelayConsensuses: /recent/relay-descriptors/consensuses/
    recentRelayServers: /recent/relay-descriptors/server-descriptors/
usage-statistics:
    baseUrl: https://metrics.torproject.org
    relayUsersPath: /userstats-relay-country.csv
    # The complete file is about 40 MB
    maxDownloadBytes: 134217728
    connectTimeout: 10s
    requestTimeout: 5m
    refreshOverlapDays: 14
ip-lookup:
    shouldCache: true
    locationDatabaseFile: /ip-lookup/location.mmdb
    autonomousSystemDatabaseFile: /ip-lookup/autonomous-system.mmdb
management:
    opentelemetry:
        # Attached to the OTLP metrics export (management.otlp.metrics.export.resource-attributes no longer exists)
        resource-attributes:
            service.name: TorMap
            host.name: ${HOSTNAME:unknown}
    otlp:
        metrics:
            export:
                # Only enabled when NEW_RELIC_INGEST_KEY is set (see NewRelicMetricsConfig)
                enabled: false
                url: https://otlp.eu01.nr-data.net:4318/v1/metrics
                step: 30s
                aggregation-temporality: delta
                headers:
                    api-key: ${NEW_RELIC_INGEST_KEY:}
    endpoints:
        enabled-by-default: false
        jmx:
            exposure:
                include: []
        web:
            # Actuator endpoints that are enabled individually from the endpoint config, will be exposed via web, if appearing in this list:
            exposure:
                include: health,info,metrics,caches,httpexchanges,flyway,logfile,mappings,scheduledtasks,threaddump
            base-path: /actuator
    endpoint:
        health:
            enabled: true
            show-details: when_authorized
        info:
            enabled: true
        metrics:
            enabled: true
        caches:
            enabled: true
        httpexchanges:
            enabled: true
        flyway:
            enabled: true
        logfile:
            enabled: true
            external-file: ${LOG_DIR:./logs}/spring-boot-logger.log
        mappings:
            enabled: true
        scheduledtasks:
            enabled: true
        threaddump:
            enabled: true
logging:
    file:
        path: ${LOG_DIR:./logs}/spring-boot-logger.log
server:
    port: 8080
    http2:
        enabled: true
    compression:
        enabled: true
        min-response-size: 1024
    tomcat:
        max-http-form-post-size: 1048576 # 1 MiB
        max-swallow-size: 1048576       # 1 MiB
spring:
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
        username: ${SPRING_DATASOURCE_USERNAME:postgres}
        # You should override the default password in production environment via environment variable
        password: ${SPRING_DATASOURCE_PASSWORD:${TORMAP_DATABASE_PASSWORD:postgres}}
    flyway:
        baselineOnMigrate: true
        locations: classpath:database/migration
    jackson:
        factory:
            constraints:
                read:
                    max-document-length: ${app.http.request.max-body-bytes}
                    # The largest JSON request is a list of at most 50 000 relay IDs (see RelayDetailsController)
                    max-token-count: 60000
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                jdbc:
                    batch_size: 30
                    order_inserts: true
                    batch_versioned_data: true
                order_updates: true
    output:
        ansi:
            enabled: ALWAYS
    security:
        user:
            name: admin
    servlet:
        multipart:
            max-file-size: 1MB
            max-request-size: 1MB
springdoc:
    api-docs:
        path: /openapi
        enabled: true
    swagger-ui:
        path: /swagger
        enabled: true

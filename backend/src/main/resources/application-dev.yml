# Local development only (./gradlew bootRun, docker-compose.override.yml). Never activate in production!
app:
    http:
        cache:
            public:
                max-age-seconds: 0
    security:
        cors:
            allowed-origins: http://localhost:3000
    lite:
        full-version-url: http://localhost:3000
spring:
    datasource:
        password: ${SPRING_DATASOURCE_PASSWORD:${TORMAP_DATABASE_PASSWORD:postgres}}
springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        enabled: true

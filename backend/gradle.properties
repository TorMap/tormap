# Explicit heap sizes: since Kotlin 2.4 the compiler daemon runs out of memory with the
# Gradle defaults, e.g. in GitHub's CodeQL autobuild.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
# Release of https://github.com/TorMap/ip-lookup-data with the IP lookup databases, updated by Renovate
ipLookupDataVersion=2026-11

compressionLevel: mixed

defaultSemverRangePrefix: ""

enableGlobalCache: true

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.18.0.cjs

# Supply chain: never run dependency install scripts, and only install versions published at least 3 days ago
# (matches the non-major minimumReleaseAge in Renovate; Renovate additionally waits 7 days for majors).
enableScripts: false

npmMinimalAgeGate: 3d

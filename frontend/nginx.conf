server {
  listen 8080;
  root /usr/share/nginx/html/;
  include /etc/nginx/mime.types;
  server_tokens off;

  # The app has a single page (its views live in the URL hash), so unknown paths are real 404s, not the app
  error_page 404 /404.html;

  # Revalidated on every use, so browsers find a new index.html, service worker (sw.js) and manifest right away
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }

  # File names contain a hash of their content
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "max-age=31536000, immutable";
    try_files $uri =404;
  }

  # security.txt and other well-known files, never the app's index.html
  location /.well-known/ {
    include /etc/nginx/snippets/security-headers.conf;
    charset utf-8;
    try_files $uri =404;
  }
}
